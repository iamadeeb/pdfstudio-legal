<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --primary: #1663ff;
      --ink: #1f2937;
      --muted: #667085;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #dfe4ee;
      --soft: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.65;
      background: var(--bg);
      color: var(--ink);
    }

    .shell {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    header {
      padding: 34px 34px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tab,
    select {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 14px;
    }

    .tab {
      cursor: pointer;
      font-weight: 700;
    }

    .tab.active {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary);
    }

    select {
      margin-left: auto;
    }

    main {
      padding: 34px;
    }

    .doc-title {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      color: var(--primary);
    }

    .updated {
      margin: 8px 0 28px;
      color: var(--muted);
      font-style: italic;
    }

    h2 {
      margin: 34px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
      font-size: 22px;
    }

    p {
      margin: 12px 0;
    }

    ul {
      margin: 12px 0 18px;
      padding-left: 22px;
    }

    li {
      margin: 8px 0;
    }

    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #eef2f7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
    }

    .notice {
      margin-top: 30px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fbfcff;
      color: var(--muted);
    }

    footer {
      padding: 22px 34px 32px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 14px;
    }

    a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    [dir="rtl"] body {
      text-align: right;
    }

    @media (max-width: 640px) {
      .shell {
        width: 100%;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      header,
      main,
      footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      select {
        width: 100%;
        margin-left: 0;
      }

      .doc-title {
        font-size: 28px;
      }
    }
  </style>
</head>

        privacy: [
          { body: ["Esta Política de Privacidade explica como o PDF Studio trata informações quando você usa o aplicativo móvel PDF Studio. O PDF Studio ajuda você a criar, converter, digitalizar, visualizar, editar, organizar, proteger, assinar, compactar, dividir, mesclar, adicionar marca d'água, extrair texto e compartilhar arquivos PDF.", "Nós não vendemos seus documentos. Não exigimos que você crie uma conta. Os arquivos que você escolhe, cria, digitaliza, converte, edita ou salva geralmente são processados localmente no seu dispositivo."], list: ["O app pode usar serviços de terceiros para anúncios, compras, relatórios de falhas e recursos de loja ou plataforma.", "Serviços de terceiros podem coletar informações de dispositivo, diagnóstico, uso, publicidade e compras conforme suas próprias políticas.", "Você controla câmera, fotos, arquivos, notificações e outras permissões nas configurações do dispositivo."] },
          { body: ["O PDF Studio pode processar arquivos e informações no seu dispositivo quando você escolhe usar seus recursos."], list: ["PDFs, imagens, fotos, documentos digitalizados, arquivos de texto, assinaturas, marcas d'água, pastas, etiquetas, nomes de arquivo e metadados relacionados.", "Arquivos escolhidos pelo seletor de arquivos ou biblioteca de fotos.", "Imagens capturadas pela câmera.", "Texto reconhecido em PDFs ou imagens por OCR.", "Arquivos de saída criados pelo app, incluindo PDFs convertidos, compactados, divididos, mesclados, assinados, protegidos, exportações de imagem e arquivos de texto extraído."] },
          { body: ["O PDF Studio solicita permissões apenas quando uma função precisa delas. Você pode negar ou revogar permissões nas configurações do dispositivo. Alguns recursos podem não funcionar sem a permissão necessária."], list: ["Câmera: para digitalizar documentos ou capturar imagens.", "Biblioteca de fotos ou mídia: para selecionar imagens, importar mídia ou salvar arquivos convertidos.", "Arquivos ou armazenamento: para selecionar, ler, criar, salvar, exportar ou compartilhar arquivos.", "Notificações: para mostrar progresso ou conclusão de processamento PDF em segundo plano.", "Permissões de serviço em primeiro plano ou processamento em segundo plano no Android: para continuar operações longas e mostrar progresso."] },
          { body: ["O PDF Studio foi projetado para processar seus documentos localmente no dispositivo. Não operamos um servidor de envio de documentos para conversão, digitalização, compactação, OCR, mesclagem, divisão, assinatura, marca d'água ou organização de arquivos em uso normal.", "Se você compartilhar um arquivo pela folha de compartilhamento ou salvá-lo em outro app ou nuvem, esse serviço de terceiro tratará o arquivo conforme seus próprios termos e política de privacidade."] },
          { body: ["O PDF Studio pode usar bibliotecas de reconhecimento de texto no dispositivo para identificar texto em imagens ou páginas PDF baseadas em imagem. Resultados de OCR podem ser salvos localmente quando você os salva como texto ou outra saída. OCR pode conter erros; revise o texto extraído antes de confiar nele."] },
          { body: ["O PDF Studio pode exibir anúncios usando Google Mobile Ads / AdMob. Provedores de anúncios podem coletar ou receber informações para veiculação, medição, prevenção de fraude, análise e melhoria do serviço."], list: ["Identificadores do dispositivo, incluindo identificadores de publicidade quando disponíveis.", "Endereço IP ou localização aproximada inferida do IP.", "Dados de interação com anúncios, como anúncios exibidos, cliques e impressões.", "Informações de interação e desempenho do app.", "Informações de diagnóstico relacionadas ao SDK de anúncios."] },
          { body: ["O PDF Studio pode usar Firebase Crashlytics para diagnosticar falhas, melhorar a confiabilidade e entender erros técnicos. Relatórios de falha são usados para identificar e corrigir bugs."], list: ["Rastros de falha e stack traces.", "Versão do app, identificador do pacote e número de build.", "Modelo do dispositivo, versão do sistema operacional, arquitetura da CPU, memória, espaço em disco e diagnósticos relacionados.", "Identificadores de instalação usados por Firebase ou Crashlytics.", "Horários e detalhes técnicos associados a falhas."] },
          { body: ["O PDF Studio pode oferecer uma compra premium única e não consumível. As compras são processadas pela Apple App Store, Google Play ou outra loja aplicável. Não recebemos nem armazenamos os dados completos do seu cartão.", "Product ID: <code>pdfstudio_premium_lifetime</code>. Finalidade: desbloquear recursos Premium e/ou remover anúncios, conforme descrito no app no momento da compra."] },
          { body: ["O PDF Studio não exige cadastro de conta e não coleta intencionalmente seu nome, email, telefone, endereço, contatos, localização GPS precisa, número de cartão ou conteúdo dos documentos em nossos servidores para funcionamento normal."] },
          { body: ["O PDF Studio pode incluir ou interagir com Google Mobile Ads / AdMob, Firebase e Firebase Crashlytics, Apple App Store e StoreKit, Google Play e Google Play Billing, além de serviços de arquivos, câmera, fotos, compartilhamento, notificações e armazenamento da plataforma."] },
          { body: ["Arquivos criados ou importados permanecem no dispositivo até você excluí-los, desinstalar o app, limpar dados ou movê-los/compartilhá-los. Você pode revogar permissões, gerenciar personalização de anúncios, restaurar compras, solicitar reembolsos pela loja e nos contatar sobre privacidade.", "Nenhum método de armazenamento ou processamento é totalmente seguro. Proteja seu dispositivo com senha ou biometria e evite compartilhar documentos sensíveis com apps ou pessoas em que não confia."] },
          { body: ["O PDF Studio não é direcionado a crianças menores de 13 anos ou à idade mínima equivalente na sua jurisdição. Não coletamos conscientemente informações pessoais de crianças por um sistema de contas.", "Dependendo da sua localização, você pode ter direitos de acessar, excluir, corrigir, restringir, contestar ou receber uma cópia de informações pessoais. Entre em contato para solicitações de privacidade."] },
          { body: ["Podemos atualizar esta Política de Privacidade periodicamente. A política atualizada será publicada com nova data de atualização.", "Para perguntas de privacidade, contate: <a href=\"mailto:" + SUPPORT_EMAIL + "\">" + SUPPORT_EMAIL + "</a>."] }
        ],
        terms: [
          { body: ["Estes Termos de Serviço regem seu uso do PDF Studio. Ao baixar, acessar ou usar o PDF Studio, você concorda com estes Termos. Se não concordar, não use o app.", "O PDF Studio fornece ferramentas para criar, converter, digitalizar, visualizar, organizar, editar, proteger, assinar, compactar, dividir, mesclar, adicionar marca d'água, extrair texto e compartilhar PDFs e documentos relacionados."] },
          { body: ["Sujeito a estes Termos e às regras da loja, concedemos a você uma licença limitada, não exclusiva, intransferível e revogável para instalar e usar o PDF Studio para uso pessoal ou comercial interno."], list: ["Você não pode copiar, modificar, fazer engenharia reversa, descompilar, vender, alugar, sublicenciar ou distribuir o app, exceto quando permitido por lei.", "Você não pode usar o app para violar leis, direitos de terceiros, segurança do app, sistemas de loja, anúncios, compras ou licenciamento."] },
          { body: ["Você mantém a propriedade dos documentos, imagens, textos, assinaturas, marcas d'água, nomes de arquivo, pastas e outros conteúdos que cria, importa, digitaliza, edita, salva ou compartilha usando o PDF Studio.", "Você é responsável pelo seu conteúdo e por possuir os direitos e permissões necessários para processá-lo, editá-lo, convertê-lo, assiná-lo, protegê-lo, exportá-lo ou compartilhá-lo."] },
          { body: ["O PDF Studio foi projetado para processar documentos principalmente no seu dispositivo. Você é responsável por salvar, fazer backup, exportar e proteger arquivos importantes. Antes de editar documentos importantes, mantenha uma cópia separada."] },
          { body: ["OCR, extração de texto, conversão de imagens, compactação, manipulação de páginas, proteção PDF, assinaturas e processamento PDF podem gerar erros ou resultados inesperados. Revise os arquivos antes de confiar neles.", "Recursos de assinatura e senha são ferramentas de conveniência e não garantem validade legal, verificação de identidade, autenticidade, não repúdio, força de criptografia para todos os casos ou conformidade regulatória específica."] },
          { body: ["O PDF Studio pode oferecer uma compra premium única e não consumível. Product ID: <code>pdfstudio_premium_lifetime</code>. Premium pode desbloquear recursos e/ou remover anúncios conforme descrito no app no momento da compra.", "Preços, impostos, moeda, disponibilidade e recursos incluídos podem variar por país, plataforma, loja e versão. O acesso entre iOS e Android não é garantido salvo declaração expressa."] },
          { body: ["Pagamentos são processados pela loja onde você baixa ou compra o app, como Apple App Store ou Google Play. Reembolsos, cancelamentos, impostos, disputas, compartilhamento familiar e restauração de compras seguem as políticas da loja."] },
          { body: ["A versão gratuita do PDF Studio pode exibir anúncios. Anúncios podem ser entregues por provedores externos. Não somos responsáveis por conteúdo, produtos, serviços, sites ou alegações de terceiros.", "O PDF Studio pode depender de bibliotecas, SDKs, plataformas e serviços de terceiros, incluindo lojas, publicidade, relatórios de falhas, bibliotecas PDF/OCR, seletores de arquivos, APIs de câmera/fotos, compartilhamento e notificações."] },
          { body: ["Nossa Política de Privacidade explica como informações são tratadas quando você usa o PDF Studio. URL: <a href=\"" + PRIVACY_URL + "\">" + PRIVACY_URL + "</a>."] },
          { body: ["Você concorda em não usar o PDF Studio para violar leis, infringir direitos, criar ou compartilhar conteúdo ilegal, contornar segurança, deturpar uma assinatura ou status de documento, ou interferir com app, lojas, cobrança, anúncios, análises ou relatórios de falha."] },
          { body: ["O PDF Studio, incluindo software, design, marca, ícones, interface e outros materiais, pertence a nós ou a nossos licenciadores e é protegido por leis de propriedade intelectual. Estes Termos não transferem a propriedade do app para você."] },
          { body: ["O PDF Studio é fornecido no estado em que se encontra e conforme disponível, na máxima extensão permitida por lei. Não garantimos que o app será ininterrupto, livre de erros, seguro, compatível com todos os arquivos ou adequado ao seu propósito.", "Na máxima extensão permitida por lei, não seremos responsáveis por danos indiretos, incidentais, especiais, consequenciais, exemplares ou punitivos, nem por perda de lucros, receita, dados, documentos, negócios, reputação ou funcionalidade do dispositivo."] },
          { body: ["Podemos atualizar estes Termos periodicamente. Os Termos atualizados serão publicados com nova data. Seu uso contínuo após mudanças significa aceitação dos Termos atualizados quando permitido por lei.", "Para suporte ou perguntas sobre termos, contate: <a href=\"mailto:" + SUPPORT_EMAIL + "\">" + SUPPORT_EMAIL + "</a>."] }
        ]

      ar: {
        privacy: [
          { body: ["توضح سياسة الخصوصية هذه كيف يتعامل PDF Studio مع المعلومات عند استخدام تطبيق PDF Studio للهاتف المحمول. يساعدك PDF Studio على إنشاء ملفات PDF وتحويلها ومسحها ضوئيا وعرضها وتحريرها وتنظيمها وحمايتها وتوقيعها وضغطها وتقسيمها ودمجها وإضافة العلامات المائية واستخراج النص ومشاركتها.", "لا نبيع مستنداتك. لا نطلب منك إنشاء حساب. عادة تتم معالجة الملفات التي تختارها أو تنشئها أو تمسحها أو تحولها أو تعدلها أو تحفظها محليا على جهازك."], list: ["قد يستخدم التطبيق خدمات أطراف ثالثة للإعلانات والمشتريات وتقارير الأعطال وميزات المتجر أو المنصة.", "قد تجمع خدمات الأطراف الثالثة معلومات الجهاز والتشخيص والاستخدام والإعلانات والمشتريات وفقا لسياساتها الخاصة.", "يمكنك التحكم في الكاميرا والصور والملفات والإشعارات والأذونات الأخرى من إعدادات جهازك."] },
          { body: ["قد يعالج PDF Studio الملفات والمعلومات على جهازك عندما تختار استخدام ميزات التطبيق."], list: ["ملفات PDF والصور والمستندات الممسوحة والملفات النصية والتوقيعات والعلامات المائية والمجلدات والوسوم وأسماء الملفات وبيانات المستندات الوصفية.", "الملفات المختارة من منتقي الملفات أو مكتبة الصور.", "الصور الملتقطة بكاميرا الجهاز.", "النص الذي يتم التعرف عليه من ملفات PDF أو الصور باستخدام OCR.", "ملفات الإخراج التي ينشئها التطبيق، بما في ذلك ملفات PDF المحولة أو المضغوطة أو المقسمة أو المدمجة أو الموقعة أو المحمية وتصديرات الصور وملفات النص المستخرج."] },
          { body: ["يطلب PDF Studio الأذونات فقط عند الحاجة إلى ميزة معينة. يمكنك رفض الأذونات أو إلغاؤها من إعدادات الجهاز. قد لا تعمل بعض الميزات دون الإذن المطلوب."], list: ["الكاميرا: لمسح المستندات أو التقاط الصور.", "مكتبة الصور أو الوسائط: لاختيار الصور أو استيراد الوسائط أو حفظ الملفات المحولة.", "الملفات أو التخزين: لاختيار الملفات أو قراءتها أو إنشائها أو حفظها أو تصديرها أو مشاركتها.", "الإشعارات: لعرض تقدم أو اكتمال معالجة PDF في الخلفية.", "أذونات الخدمة الأمامية أو المعالجة في الخلفية على Android: لمواصلة عمليات المستندات الطويلة وعرض التقدم."] },
          { body: ["تم تصميم PDF Studio لمعالجة مستنداتك محليا على جهازك. نحن لا نشغل خادم رفع مستندات للوظائف العادية مثل التحويل أو المسح أو الضغط أو OCR أو الدمج أو التقسيم أو التوقيع أو العلامات المائية أو تنظيم الملفات.", "إذا شاركت ملفا عبر صفحة المشاركة أو حفظته في تطبيق أو خدمة سحابية أخرى، فسيتعامل ذلك الطرف الثالث مع الملف وفقا لشروطه وسياسة الخصوصية الخاصة به."] },
          { body: ["قد يستخدم PDF Studio مكتبات التعرف على النص على الجهاز للتعرف على النص في الصور أو صفحات PDF المعتمدة على الصور. قد يتم حفظ نتائج OCR محليا عندما تحفظها كملف نصي أو إخراج آخر. قد لا يكون OCR دقيقا دائما، لذلك راجع النص المستخرج قبل الاعتماد عليه."] },
          { body: ["قد يعرض PDF Studio إعلانات باستخدام Google Mobile Ads / AdMob. قد يجمع مزودو الإعلانات أو يتلقون معلومات لتقديم الإعلانات وقياسها ومنع الاحتيال والتحليلات وتحسين الخدمة."], list: ["معرفات الجهاز، بما في ذلك معرفات الإعلان عند توفرها.", "عنوان IP أو الموقع التقريبي المستنتج منه.", "بيانات التفاعل مع الإعلانات مثل الإعلانات المعروضة والنقرات ومرات الظهور.", "معلومات تفاعل التطبيق وأدائه.", "معلومات تشخيصية متعلقة بحزمة SDK للإعلانات."] },
          { body: ["قد يستخدم PDF Studio Firebase Crashlytics للمساعدة في تشخيص الأعطال وتحسين الموثوقية وفهم الأخطاء التقنية. تستخدم تقارير الأعطال لتحديد المشكلات وإصلاحها."], list: ["آثار الأعطال و stack traces.", "إصدار التطبيق ومعرف الحزمة ورقم البناء.", "طراز الجهاز وإصدار نظام التشغيل وبنية CPU والذاكرة ومساحة القرص والتشخيصات ذات الصلة.", "معرفات التثبيت التي يستخدمها Firebase أو Crashlytics.", "الطوابع الزمنية والتفاصيل التقنية المرتبطة بالأعطال."] },
          { body: ["قد يقدم PDF Studio عملية شراء Premium لمرة واحدة وغير قابلة للاستهلاك. تتم معالجة المشتريات بواسطة Apple App Store أو Google Play أو متجر تطبيقات آخر. لا نستلم ولا نخزن تفاصيل بطاقة الدفع الكاملة.", "Product ID: <code>pdfstudio_premium_lifetime</code>. الغرض: فتح ميزات Premium و/أو إزالة الإعلانات كما هو موضح في التطبيق وقت الشراء."] },
          { body: ["لا يتطلب PDF Studio تسجيل حساب ولا يجمع عمدا اسمك أو بريدك الإلكتروني أو رقم هاتفك أو عنوانك البريدي أو جهات اتصالك أو موقع GPS الدقيق أو رقم بطاقة الدفع أو محتوى مستنداتك على خوادمنا للوظائف العادية."] },
          { body: ["قد يتضمن PDF Studio أو يتفاعل مع Google Mobile Ads / AdMob و Firebase و Firebase Crashlytics و Apple App Store و StoreKit و Google Play و Google Play Billing وخدمات منتقي الملفات والكاميرا ومكتبة الصور والمشاركة والإشعارات والتخزين الخاصة بالمنصة."] },
          { body: ["تبقى الملفات التي تنشئها أو تستوردها على جهازك حتى تحذفها أو تزيل التطبيق أو تمسح بياناته أو تنقلها أو تشاركها. يمكنك إلغاء الأذونات وإدارة تخصيص الإعلانات واستعادة المشتريات وطلب الاسترداد من المتجر والتواصل معنا بشأن طلبات الخصوصية.", "لا توجد طريقة تخزين أو معالجة آمنة تماما. احم جهازك برمز مرور أو قفل حيوي وتجنب مشاركة المستندات الحساسة مع تطبيقات أو أشخاص لا تثق بهم."] },
          { body: ["PDF Studio غير موجه للأطفال دون 13 عاما أو الحد الأدنى المكافئ في بلدك. نحن لا نجمع عمدا معلومات شخصية من الأطفال عبر نظام حسابات.", "بحسب موقعك، قد تكون لك حقوق الوصول أو الحذف أو التصحيح أو التقييد أو الاعتراض أو الحصول على نسخة من المعلومات الشخصية. تواصل معنا لتقديم طلب خصوصية."] },
          { body: ["قد نقوم بتحديث سياسة الخصوصية هذه من وقت لآخر. سيتم نشر السياسة المحدثة مع تاريخ تحديث جديد.", "لأسئلة الخصوصية تواصل عبر: <a href=\"mailto:" + SUPPORT_EMAIL + "\">" + SUPPORT_EMAIL + "</a>."] }
        ],
        terms: [
          { body: ["تحكم شروط الخدمة هذه استخدامك لـ PDF Studio. بتنزيل PDF Studio أو الوصول إليه أو استخدامه، فإنك توافق على هذه الشروط. إذا لم توافق، فلا تستخدم التطبيق.", "يوفر PDF Studio أدوات لإنشاء ملفات PDF والمستندات ذات الصلة وتحويلها ومسحها وعرضها وتنظيمها وتحريرها وحمايتها وتوقيعها وضغطها وتقسيمها ودمجها وإضافة العلامات المائية واستخراج النص ومشاركتها."] },
          { body: ["وفقا لهذه الشروط وقواعد متجر التطبيقات، نمنحك ترخيصا محدودا وغير حصري وغير قابل للتحويل وقابلا للإلغاء لتثبيت PDF Studio واستخدامه للاستخدام الشخصي أو التجاري الداخلي."], list: ["لا يجوز لك نسخ التطبيق أو تعديله أو عكس هندسته أو فك ترجمته أو بيعه أو تأجيره أو ترخيصه من الباطن أو توزيعه إلا حيث يسمح القانون.", "لا يجوز لك استخدام التطبيق لانتهاك القوانين أو حقوق الأطراف الثالثة أو أمان التطبيق أو أنظمة المتجر أو الإعلانات أو المشتريات أو الترخيص."] },
          { body: ["تحتفظ بملكية المستندات والصور والنصوص والتوقيعات والعلامات المائية وأسماء الملفات والمجلدات والمحتوى الآخر الذي تنشئه أو تستورده أو تمسحه أو تعدله أو تحفظه أو تشاركه باستخدام PDF Studio.", "أنت مسؤول عن محتواك وعن التأكد من امتلاك الحقوق والأذونات اللازمة لمعالجته أو تعديله أو تحويله أو توقيعه أو حمايته أو تصديره أو مشاركته."] },
          { body: ["تم تصميم PDF Studio لمعالجة المستندات أساسا على جهازك. أنت مسؤول عن حفظ الملفات المهمة ونسخها احتياطيا وتصديرها وحمايتها. قبل تعديل مستندات مهمة، احتفظ بنسخة احتياطية منفصلة."] },

    function localizeDoc(doc, title, updated, headings, translatedSections) {
      return {
        title,
        updated,
        sections: doc.sections.map((section, index) => ({
          ...section,
          heading: headings[index] || section.heading,
          body: translatedSections?.[index]?.body || section.body,
          list: translatedSections?.[index]?.list || section.list
        }))
      };
    }

    Object.entries(localizedContent).forEach(([code, locale]) => {
      legal[code] = {
        name: locale.name,
        dir: locale.dir,
        subtitle: locale.subtitle,
        footer: locale.footerPrefix + SUPPORT_EMAIL + ".",
        privacy: localizeDoc(
          legal.en.privacy,
          locale.privacyTitle,
          locale.updated,
          locale.privacyHeadings,
          localizedSectionText[code]?.privacy
        ),
        terms: localizeDoc(
          legal.en.terms,
          locale.termsTitle,
          locale.updated,
          locale.termsHeadings,
          localizedSectionText[code]?.terms
        )
      };
    });

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        lang: params.get("lang") || "en",
        doc: params.get("doc") || "privacy"
      };
    }

    function setParams(next) {
      const current = getParams();
      const params = new URLSearchParams({
        lang: next.lang || current.lang,
        doc: next.doc || current.doc
      });
      history.replaceState(null, "", "?" + params.toString());
      render();
    }

    function renderLanguageOptions(selectedLang) {
      const select = document.getElementById("languageSelect");
      select.innerHTML = "";
      Object.entries(legal).forEach(([code, value]) => {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = value.name;
        option.selected = code === selectedLang;
        select.appendChild(option);
      });
    }

    function renderSections(sections) {
      return sections.map((section) => {
        const body = (section.body || []).map((p) => "<p>" + p + "</p>").join("");
        const list = section.list
          ? "<ul>" + section.list.map((item) => "<li>" + item + "</li>").join("") + "</ul>"
          : "";
        return "<section><h2>" + section.heading + "</h2>" + body + list + "</section>";
      }).join("");
    }

    function render() {
      const params = getParams();
      const lang = legal[params.lang] ? params.lang : "en";
      const doc = params.doc === "terms" ? "terms" : "privacy";
      const data = legal[lang];
      const documentData = data[doc];

      document.documentElement.lang = lang;
      document.documentElement.dir = data.dir;
      document.title = "PDF Studio - " + documentData.title;

      document.getElementById("subtitle").textContent = data.subtitle;
      document.getElementById("footerText").textContent = data.footer;
      document.getElementById("privacyBtn").textContent = data.privacy.title;
      document.getElementById("termsBtn").textContent = data.terms.title;
      document.getElementById("privacyBtn").classList.toggle("active", doc === "privacy");
      document.getElementById("termsBtn").classList.toggle("active", doc === "terms");

      renderLanguageOptions(lang);

      document.getElementById("document").innerHTML =
        "<h1 class=\"doc-title\">" + documentData.title + "</h1>" +
        "<p class=\"updated\">" + documentData.updated + "</p>" +
        renderSections(documentData.sections);
    }

    document.getElementById("privacyBtn").addEventListener("click", () => setParams({ doc: "privacy" }));
    document.getElementById("termsBtn").addEventListener("click", () => setParams({ doc: "terms" }));
    document.getElementById("languageSelect").addEventListener("change", (event) => setParams({ lang: event.target.value }));

    render();
  </script>
