  <style>
    :root {
      --primary: #1663ff;
      --ink: #1f2937;
      --muted: #667085;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #dfe4ee;
      --soft: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.65;
      background: var(--bg);
      color: var(--ink);
    }

    .shell {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    header {
      padding: 34px 34px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tab,
    select {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 14px;
    }

    .tab {
      cursor: pointer;
      font-weight: 700;
    }

    .tab.active {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary);
    }

    select {
      margin-left: auto;
    }

    main {
      padding: 34px;
    }

    .doc-title {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      color: var(--primary);
    }

    .updated {
      margin: 8px 0 28px;
      color: var(--muted);
      font-style: italic;
    }

    h2 {
      margin: 34px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
      font-size: 22px;
    }

    p {
      margin: 12px 0;
    }

    ul {
      margin: 12px 0 18px;
      padding-left: 22px;
    }

    li {
      margin: 8px 0;
    }

    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #eef2f7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
    }

    .notice {
      margin-top: 30px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fbfcff;
      color: var(--muted);
    }

    footer {
      padding: 22px 34px 32px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 14px;
    }

    a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    [dir="rtl"] body {
      text-align: right;
    }

    @media (max-width: 640px) {
      .shell {
        width: 100%;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      header,
      main,
      footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      select {
        width: 100%;
        margin-left: 0;
      }

      .doc-title {
        font-size: 28px;
      }
    }
  </style>
</head>

          "Üçüncü Taraf Hizmetleri",
          "Saklama, Güvenlik ve Seçimleriniz",
          "Çocuklar ve Gizlilik Hakları",
          "Değişiklikler ve İletişim"
        ],
        termsHeadings: [
          "Sözleşme",
          "Lisans",
          "Belgeleriniz",
          "Yerel İşleme ve Yedekler",
          "Doğruluk ve Belge Araçları",
          "Premium Satın Alma",
          "Ödemeler, İadeler ve Faturalandırma",
          "Reklamlar ve Üçüncü Taraf Hizmetleri",
          "Gizlilik",
          "Kullanıcı Davranışı",
          "Fikri Mülkiyet",
          "Garanti Reddi ve Sorumluluk Sınırı",
          "Değişiklikler ve İletişim"
        ]
      }
    };

    function localizeDoc(doc, title, updated, headings) {
      return {
        title,
        updated,
        sections: doc.sections.map((section, index) => ({
          ...section,
          heading: headings[index] || section.heading
        }))
      };
    }

    Object.entries(localizedContent).forEach(([code, locale]) => {
      legal[code] = {
        name: locale.name,
        dir: locale.dir,
        subtitle: locale.subtitle,
        footer: locale.footerPrefix + SUPPORT_EMAIL + ".",
        privacy: localizeDoc(
          legal.en.privacy,
          locale.privacyTitle,
          locale.updated,
          locale.privacyHeadings
        ),
        terms: localizeDoc(
          legal.en.terms,
          locale.termsTitle,
          locale.updated,
          locale.termsHeadings
        )
      };
    });

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        lang: params.get("lang") || "en",
        doc: params.get("doc") || "privacy"
      };
    }

    function setParams(next) {
      const current = getParams();
      const params = new URLSearchParams({
        lang: next.lang || current.lang,
        doc: next.doc || current.doc
      });
      history.replaceState(null, "", "?" + params.toString());
      render();
    }

    function renderLanguageOptions(selectedLang) {
      const select = document.getElementById("languageSelect");
      select.innerHTML = "";
      Object.entries(legal).forEach(([code, value]) => {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = value.name;
        option.selected = code === selectedLang;
        select.appendChild(option);
      });
    }

    function renderSections(sections) {
      return sections.map((section) => {
        const body = (section.body || []).map((p) => "<p>" + p + "</p>").join("");
        const list = section.list
          ? "<ul>" + section.list.map((item) => "<li>" + item + "</li>").join("") + "</ul>"
          : "";
        return "<section><h2>" + section.heading + "</h2>" + body + list + "</section>";
      }).join("");
    }

    function render() {
      const params = getParams();
      const lang = legal[params.lang] ? params.lang : "en";
      const doc = params.doc === "terms" ? "terms" : "privacy";
      const data = legal[lang];
      const documentData = data[doc];

      document.documentElement.lang = lang;
      document.documentElement.dir = data.dir;
      document.title = "PDF Studio - " + documentData.title;

      document.getElementById("subtitle").textContent = data.subtitle;
      document.getElementById("footerText").textContent = data.footer;
      document.getElementById("privacyBtn").textContent = data.privacy.title;
      document.getElementById("termsBtn").textContent = data.terms.title;
      document.getElementById("privacyBtn").classList.toggle("active", doc === "privacy");
      document.getElementById("termsBtn").classList.toggle("active", doc === "terms");

      renderLanguageOptions(lang);

      document.getElementById("document").innerHTML =
        "<h1 class=\"doc-title\">" + documentData.title + "</h1>" +
        "<p class=\"updated\">" + documentData.updated + "</p>" +
        renderSections(documentData.sections);
    }

    document.getElementById("privacyBtn").addEventListener("click", () => setParams({ doc: "privacy" }));
    document.getElementById("termsBtn").addEventListener("click", () => setParams({ doc: "terms" }));
    document.getElementById("languageSelect").addEventListener("change", (event) => setParams({ lang: event.target.value }));

    render();
  </script>
</body>
</html>
